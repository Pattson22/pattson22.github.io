<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'JetBrains Mono', monospace">
  <defs>
    <style>
      .lbl{fill:#9aa6b6;font-size:12px}
      .ttl{fill:#eef2f7;font-size:13px;font-weight:700}
      .svc{fill:#eef2f7;font-size:12px;font-weight:600}
      .box{fill:#121826;stroke:#2a3346;stroke-width:1.5}
      .aws{fill:#ff9900}
      .flow{stroke:#ff9900;stroke-width:2;fill:none;marker-end:url(#arr2)}
    </style>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ff9900"/></marker>
  </defs>

  <rect width="900" height="460" fill="#0c1119"/>
  <text x="28" y="34" class="ttl">Highly Available Crypto API — AWS Architecture</text>
  <text x="28" y="52" class="lbl">Terraform · Multi-AZ · Application Load Balancer · Auto Scaling · IAM</text>

  <!-- Users -->
  <circle cx="70" cy="230" r="26" fill="#121826" stroke="#2a3346" stroke-width="1.5"/>
  <text x="70" y="235" text-anchor="middle" class="svc">Clients</text>

  <!-- Route 53 -->
  <rect x="150" y="200" width="110" height="60" rx="10" class="box"/>
  <text x="205" y="224" text-anchor="middle" class="aws" font-size="12" font-weight="700">Route 53</text>
  <text x="205" y="242" text-anchor="middle" class="lbl">DNS</text>

  <!-- ALB -->
  <rect x="300" y="200" width="120" height="60" rx="10" class="box"/>
  <text x="360" y="224" text-anchor="middle" class="aws" font-size="12" font-weight="700">ALB</text>
  <text x="360" y="242" text-anchor="middle" class="lbl">+ Auto Scaling</text>

  <!-- VPC -->
  <rect x="460" y="90" width="410" height="290" rx="12" fill="none" stroke="#37415a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="476" y="110" class="lbl">VPC 10.0.0.0/16</text>

  <!-- AZ A -->
  <rect x="480" y="125" width="170" height="110" rx="10" fill="none" stroke="#2a3346" stroke-width="1.5"/>
  <text x="565" y="145" text-anchor="middle" class="lbl">Availability Zone A</text>
  <rect x="500" y="155" width="130" height="60" rx="9" class="box"/>
  <text x="565" y="180" text-anchor="middle" class="svc">EC2 · API</text>
  <text x="565" y="198" text-anchor="middle" class="aws" font-size="11">Docker</text>

  <!-- AZ B -->
  <rect x="680" y="125" width="170" height="110" rx="10" fill="none" stroke="#2a3346" stroke-width="1.5"/>
  <text x="765" y="145" text-anchor="middle" class="lbl">Availability Zone B</text>
  <rect x="700" y="155" width="130" height="60" rx="9" class="box"/>
  <text x="765" y="180" text-anchor="middle" class="svc">EC2 · API</text>
  <text x="765" y="198" text-anchor="middle" class="aws" font-size="11">Docker</text>

  <!-- DynamoDB / cache -->
  <rect x="560" y="270" width="210" height="60" rx="10" class="box"/>
  <text x="665" y="294" text-anchor="middle" class="svc">DynamoDB / ElastiCache</text>
  <text x="665" y="312" text-anchor="middle" class="lbl">Price data &amp; caching</text>

  <!-- Flows -->
  <path class="flow" d="M98,230 L148,230"/>
  <path class="flow" d="M260,230 L298,230"/>
  <path class="flow" d="M420,222 L498,190"/>
  <path class="flow" d="M420,238 L698,190"/>
  <path class="flow" d="M565,215 L620,268"/>
  <path class="flow" d="M765,215 L710,268"/>

  <!-- IAM + Secrets -->
  <rect x="28" y="320" width="200" height="56" rx="10" class="box"/>
  <text x="128" y="342" text-anchor="middle" style="fill:#4d9fff" font-size="12" font-weight="700">IAM Roles + Secrets Manager</text>
  <text x="128" y="360" text-anchor="middle" class="lbl">No hardcoded credentials</text>

  <text x="300" y="430" class="lbl">Traffic spreads across both AZs — the service survives the loss of an entire Availability Zone.</text>
</svg>
