<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'JetBrains Mono', monospace">
  <defs>
    <style>
      .lbl{fill:#9aa6b6;font-size:12px}
      .ttl{fill:#eef2f7;font-size:13px;font-weight:700}
      .svc{fill:#eef2f7;font-size:12px;font-weight:600}
      .box{fill:#121826;stroke:#2a3346;stroke-width:1.5;rx:10}
      .aws{fill:#ff9900}
      .flow{stroke:#ff9900;stroke-width:2;fill:none;marker-end:url(#arr)}
      .ci{stroke:#4d9fff;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#arrb)}
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ff9900"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4d9fff"/></marker>
  </defs>

  <rect width="900" height="460" fill="#0c1119"/>
  <text x="28" y="34" class="ttl">Multi-tier Cloud Application — AWS Architecture</text>
  <text x="28" y="52" class="lbl">Provisioned with Terraform · Containerised with Docker · Shipped via GitHub Actions</text>

  <!-- VPC boundary -->
  <rect x="200" y="78" width="672" height="300" rx="12" fill="none" stroke="#37415a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="216" y="98" class="lbl">VPC 10.0.0.0/16  ·  2 Availability Zones</text>

  <!-- Users -->
  <circle cx="70" cy="220" r="26" fill="#121826" stroke="#2a3346" stroke-width="1.5"/>
  <text x="70" y="225" text-anchor="middle" class="svc">Users</text>

  <!-- ALB -->
  <rect x="230" y="190" width="120" height="60" rx="10" class="box"/>
  <text x="290" y="214" text-anchor="middle" class="aws" font-size="12" font-weight="700">ALB</text>
  <text x="290" y="232" text-anchor="middle" class="lbl">Load Balancer</text>

  <!-- Web tier (public subnet) -->
  <rect x="400" y="110" width="150" height="80" rx="10" class="box"/>
  <text x="475" y="134" text-anchor="middle" class="svc">Web Tier</text>
  <text x="475" y="152" text-anchor="middle" class="lbl">Public Subnet</text>
  <text x="475" y="170" text-anchor="middle" class="aws" font-size="11">EC2 · Docker</text>

  <!-- App tier (private subnet) -->
  <rect x="400" y="250" width="150" height="80" rx="10" class="box"/>
  <text x="475" y="274" text-anchor="middle" class="svc">App Tier</text>
  <text x="475" y="292" text-anchor="middle" class="lbl">Private Subnet</text>
  <text x="475" y="310" text-anchor="middle" class="aws" font-size="11">EC2 · Docker</text>

  <!-- DB tier -->
  <rect x="610" y="180" width="150" height="80" rx="10" class="box"/>
  <text x="685" y="204" text-anchor="middle" class="svc">Database Tier</text>
  <text x="685" y="222" text-anchor="middle" class="lbl">Private Subnet</text>
  <text x="685" y="240" text-anchor="middle" class="aws" font-size="11">RDS</text>

  <!-- Flows -->
  <path class="flow" d="M98,220 L228,220"/>
  <path class="flow" d="M350,205 L398,160"/>
  <path class="flow" d="M350,235 L398,290"/>
  <path class="flow" d="M550,150 L630,195"/>
  <path class="flow" d="M550,290 L630,245"/>

  <!-- CI/CD pipeline -->
  <rect x="28" y="330" width="150" height="56" rx="10" class="box"/>
  <text x="103" y="352" text-anchor="middle" class="svc">GitHub</text>
  <text x="103" y="370" text-anchor="middle" class="lbl">git push</text>

  <rect x="28" y="120" width="150" height="56" rx="10" class="box"/>
  <text x="103" y="142" text-anchor="middle" style="fill:#4d9fff" font-size="12" font-weight="700">GitHub Actions</text>
  <text x="103" y="160" text-anchor="middle" class="lbl">build · test · deploy</text>

  <path class="ci" d="M103,330 L103,178"/>
  <path class="ci" d="M178,148 L398,140" />
  <text x="250" y="424" class="lbl">— Traffic flow (HTTPS)</text>
  <line x1="232" y1="420" x2="246" y2="420" class="flow"/>
  <text x="430" y="424" style="fill:#4d9fff" font-size="12">- - CI/CD pipeline</text>
</svg>
